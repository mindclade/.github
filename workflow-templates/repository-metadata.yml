name: Mindclade repository metadata

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    uses: mindclade/.github/.github/workflows/reusable-metadata-validation.yml@f9b6ebcecd197157d9466eeacf8e2864e32c9a79
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
