name: Mindclade repository metadata

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    uses: mindclade/.github/.github/workflows/reusable-metadata-validation.yml@fc5af9efc19b47078fe446feee750d7f4973195b
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
