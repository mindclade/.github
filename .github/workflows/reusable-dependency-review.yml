name: Reusable dependency review

on:
  workflow_call:
    inputs:
      source_revision:
        description: Exact caller source commit SHA.
        required: true
        type: string
      base_revision:
        description: Exact pull-request base commit SHA.
        required: true
        type: string
    outputs:
      correlation_id:
        description: Stable correlation identifier.
        value: ${{ jobs.dependency_review.outputs.correlation_id }}
      source_revision:
        description: Validated source revision.
        value: ${{ jobs.dependency_review.outputs.source_revision }}
      caller_repository:
        description: Validated caller repository.
        value: ${{ jobs.dependency_review.outputs.caller_repository }}
      trust_classification:
        description: Observed source trust classification.
        value: ${{ jobs.dependency_review.outputs.trust_classification }}
      execution_tier:
        description: Observed execution tier.
        value: ${{ jobs.dependency_review.outputs.execution_tier }}
      plan_id:
        description: Dependency-review plan identifier.
        value: ${{ jobs.dependency_review.outputs.plan_id }}
      build_id:
        description: Provider build identifier.
        value: ${{ jobs.dependency_review.outputs.build_id }}
      conclusion:
        description: Normalized conclusion.
        value: ${{ jobs.dependency_review.outputs.conclusion }}
      reason_code:
        description: Stable conclusion reason.
        value: ${{ jobs.dependency_review.outputs.reason_code }}
      evidence_digest:
        description: Canonical evidence digest.
        value: ${{ jobs.dependency_review.outputs.evidence_digest }}
      evidence_ref:
        description: Immutable evidence artifact reference.
        value: ${{ jobs.dependency_review.outputs.evidence_ref }}

permissions: {}

jobs:
  dependency_review:
    name: Mindclade / Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      correlation_id: ${{ steps.context.outputs.correlation_id }}
      source_revision: ${{ inputs.source_revision }}
      caller_repository: ${{ github.repository }}
      trust_classification: ${{ steps.context.outputs.source_trust }}
      execution_tier: ${{ steps.context.outputs.execution_tier }}
      plan_id: dependency-review-v1
      build_id: ${{ github.run_id }}
      conclusion: ${{ steps.result.outputs.conclusion }}
      reason_code: ${{ steps.result.outputs.reason_code }}
      evidence_digest: ${{ steps.evidence.outputs.evidence_digest }}
      evidence_ref: ${{ steps.evidence.outputs.evidence_ref }}
    steps:
      - id: context
        name: Validate caller context
        continue-on-error: true
        uses: $/.github/actions/validate-trusted-context
        with:
          expected-source-revision: ${{ inputs.source_revision }}
          allowed-execution-tiers: untrusted
      - id: pins
        name: Verify immutable implementation closure
        continue-on-error: true
        uses: $/.github/actions/verify-pinned-actions
      - id: base
        name: Bind observed base revision
        if: steps.context.outcome == 'success' && steps.pins.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_BASE_REVISION: ${{ inputs.base_revision }}
          OBSERVED_BASE_REVISION: ${{ steps.context.outputs.base_revision }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_BASE_REVISION}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_BASE_REVISION}" == "${OBSERVED_BASE_REVISION}" ]]
      - name: Check out exact caller revision
        if: steps.context.outcome == 'success' && steps.pins.outcome == 'success' && steps.base.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - id: review
        name: Review dependency changes
        if: steps.context.outcome == 'success' && steps.pins.outcome == 'success' && steps.base.outcome == 'success'
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4.8.2
        with:
          fail-on-severity: low
          fail-on-scopes: runtime
          vulnerability-check: true
          license-check: true
          warn-only: false
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: false
      - id: result
        name: Normalize result
        if: always()
        env:
          BASE_OUTCOME: ${{ steps.base.outcome }}
          CONTEXT_OUTCOME: ${{ steps.context.outcome }}
          CONTEXT_REASON: ${{ steps.context.outputs.reason_code }}
          PINS_OUTCOME: ${{ steps.pins.outcome }}
          PINS_REASON: ${{ steps.pins.outputs.reason_code }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -euo pipefail
          conclusion=success
          reason=DEPENDENCY_REVIEW_PASSED
          if [[ "${CONTEXT_OUTCOME}" != success ]]; then
            conclusion=action_required
            reason="${CONTEXT_REASON:-CONTEXT_INVALID}"
          elif [[ "${PINS_OUTCOME}" != success ]]; then
            conclusion=failure
            reason="${PINS_REASON:-PIN_POLICY_FAILED}"
          elif [[ "${BASE_OUTCOME}" != success ]]; then
            conclusion=failure
            reason=BASE_REVISION_MISMATCH
          elif [[ "${REVIEW_OUTCOME}" != success ]]; then
            conclusion=failure
            reason=DEPENDENCY_REVIEW_FAILED
          fi
          printf 'conclusion=%s\nreason_code=%s\n' "${conclusion}" "${reason}" >> "${GITHUB_OUTPUT}"
      - id: evidence
        name: Publish CI evidence
        if: always() && steps.context.outputs.context_json != ''
        continue-on-error: true
        uses: $/.github/actions/publish-ci-evidence
        with:
          context-json: ${{ steps.context.outputs.context_json }}
          producer: github_actions
          conclusion: ${{ steps.result.outputs.conclusion }}
          reason-code: ${{ steps.result.outputs.reason_code }}
          plan-id: dependency-review-v1
          build-id: ${{ github.run_id }}
          artifact-name: dependency-review-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Enforce result
        if: always()
        env:
          CONCLUSION: ${{ steps.result.outputs.conclusion }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail
          [[ "${CONCLUSION}" == success ]]
          [[ "${EVIDENCE_OUTCOME}" == success ]]
