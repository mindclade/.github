name: Pull request

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  merge_group:
    types: [checks_requested]

concurrency:
  group: mindclade-required-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  profile:
    name: Resolve fixed profile
    if: ${{ github.repository != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      affected_shards_json: ${{ steps.profile.outputs.affected_shards_json }}
      event_class: ${{ steps.profile.outputs.event_class }}
      not_required_shards_json: ${{ steps.profile.outputs.not_required_shards_json }}
      policy_digest: ${{ steps.profile.outputs.policy_digest }}
      profile: ${{ steps.profile.outputs.profile }}
      source_revision: ${{ steps.source.outputs.source_revision }}
    steps:
      - id: source
        name: Bind the event source revision
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_REVISION}" =~ ^[0-9a-f]{40}$ ]]
          printf 'source_revision=%s\n' "${SOURCE_REVISION}" >> "${GITHUB_OUTPUT}"
      - id: profile
        name: Resolve the immutable repository profile
        uses: mindclade/.github/.github/actions/required-workflow-profile@e90483097890030ede19981503f443a602a8e6e5
        with:
          mode: plan
          repository: ${{ github.repository }}
          event-name: ${{ github.event_name }}
          source-revision: ${{ steps.source.outputs.source_revision }}

  review_policy:
    name: Review policy
    needs: profile
    if: needs.profile.result == 'success' && needs.profile.outputs.event_class == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      decision: ${{ steps.review.outputs.decision }}
    steps:
      - id: review
        name: Evaluate head-bound review evidence
        continue-on-error: true
        uses: mindclade/.github/.github/actions/required-workflow-profile@e90483097890030ede19981503f443a602a8e6e5
        with:
          mode: review
          repository: ${{ github.repository }}
          event-name: ${{ github.event_name }}
          source-revision: ${{ needs.profile.outputs.source_revision }}
          pull-request-number: ${{ github.event.pull_request.number }}
          github-token: ${{ github.token }}
      - id: evidence
        name: Publish immutable review evidence
        if: always() && steps.review.outputs.evidence_path != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: review-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.review.outputs.evidence_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Enforce review policy and evidence publication
        if: always()
        env:
          DECISION: ${{ steps.review.outputs.decision }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -euo pipefail
          [[ "${REVIEW_OUTCOME}" == success ]]
          [[ "${EVIDENCE_OUTCOME}" == success ]]
          [[ "${DECISION}" == approved || "${DECISION}" == bypassed ]]

  nix_validation:
    name: Nix qualification
    needs: profile
    if: needs.profile.result == 'success' && needs.profile.outputs.profile == 'nix-standard'
    permissions:
      contents: read
    uses: mindclade/.github/.github/workflows/reusable-nix-validation.yml@e90483097890030ede19981503f443a602a8e6e5
    with:
      source_revision: ${{ needs.profile.outputs.source_revision }}

  classify:
    name: Classify Buildkite source
    needs: profile
    if: needs.profile.result == 'success' && needs.profile.outputs.profile == 'buildkite-isolated'
    permissions:
      contents: read
    uses: mindclade/.github/.github/workflows/reusable-metadata-validation.yml@e90483097890030ede19981503f443a602a8e6e5
    with:
      source_revision: ${{ needs.profile.outputs.source_revision }}

  fork_checks:
    name: Untrusted fork documentation
    needs: [profile, classify]
    if: >-
      needs.profile.result == 'success' &&
      needs.classify.result == 'success' &&
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
      needs.classify.outputs.trust_classification == 'untrusted'
    permissions:
      contents: read
    uses: mindclade/.github/.github/workflows/reusable-documentation-check.yml@e90483097890030ede19981503f443a602a8e6e5
    with:
      source_revision: ${{ needs.profile.outputs.source_revision }}
      documentation_roots: |-
        README.md
        docs

  dispatch:
    name: Dispatch isolated Buildkite qualification
    needs: [profile, classify]
    if: >-
      needs.profile.result == 'success' &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.trust_classification != 'untrusted'
    permissions:
      contents: read
    uses: mindclade/.github/.github/workflows/reusable-buildkite-dispatch.yml@e90483097890030ede19981503f443a602a8e6e5
    with:
      source_revision: ${{ needs.profile.outputs.source_revision }}
      pipeline_class: presubmit
    secrets:
      buildkite_dispatch_token: ${{ secrets.MINDCLADE_BUILDKITE_DISPATCH_TOKEN }}
      buildkite_pipeline: ${{ secrets.MINDCLADE_BUILDKITE_PIPELINE }}

  buildkite_required:
    name: Verify isolated Buildkite qualification
    needs: [profile, classify, dispatch]
    if: needs.dispatch.result == 'success'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: mindclade/.github/.github/workflows/reusable-required-check.yml@e90483097890030ede19981503f443a602a8e6e5
    with:
      source_revision: ${{ needs.profile.outputs.source_revision }}
      pipeline_definition_revision: ${{ needs.dispatch.outputs.pipeline_definition_revision }}
      build_id: ${{ needs.dispatch.outputs.build_id }}
      build_number: ${{ needs.dispatch.outputs.build_number }}
      correlation_id: ${{ needs.dispatch.outputs.correlation_id }}
      context_digest: ${{ needs.dispatch.outputs.context_digest }}
      archive_evidence: false
    secrets:
      buildkite_cancel_token: ${{ secrets.MINDCLADE_BUILDKITE_CANCEL_TOKEN }}
      buildkite_evidence_token: ${{ secrets.MINDCLADE_BUILDKITE_EVIDENCE_TOKEN }}
      buildkite_pipeline: ${{ secrets.MINDCLADE_BUILDKITE_PIPELINE }}

  required:
    name: required
    needs:
      - profile
      - review_policy
      - nix_validation
      - classify
      - fork_checks
      - dispatch
      - buildkite_required
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      AFFECTED_SHARDS_JSON: ${{ needs.profile.outputs.affected_shards_json }}
      BUILDKITE_REQUIRED_RESULT: ${{ needs.buildkite_required.result }}
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      DISPATCH_RESULT: ${{ needs.dispatch.result }}
      EVENT_CLASS: ${{ needs.profile.outputs.event_class }}
      FORK_CHECKS_RESULT: ${{ needs.fork_checks.result }}
      NIX_VALIDATION_RESULT: ${{ needs.nix_validation.result }}
      NOT_REQUIRED_SHARDS_JSON: ${{ needs.profile.outputs.not_required_shards_json }}
      POLICY_DIGEST: ${{ needs.profile.outputs.policy_digest }}
      PROFILE: ${{ needs.profile.outputs.profile }}
      PROFILE_RESULT: ${{ needs.profile.result }}
      REVIEW_DECISION: ${{ needs.review_policy.outputs.decision }}
      REVIEW_POLICY_RESULT: ${{ needs.review_policy.result }}
      TRUST_CLASSIFICATION: ${{ needs.classify.outputs.trust_classification }}
    steps:
      - name: Enforce the exact fail-closed shard plan
        run: |
          set -euo pipefail
          [[ "${PROFILE_RESULT}" == success ]]
          [[ "${POLICY_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          results="$(jq -cn \
            --arg review_policy "${REVIEW_POLICY_RESULT}" \
            --arg nix_validation "${NIX_VALIDATION_RESULT}" \
            --arg classify "${CLASSIFY_RESULT}" \
            --arg fork_checks "${FORK_CHECKS_RESULT}" \
            --arg dispatch "${DISPATCH_RESULT}" \
            --arg buildkite_required "${BUILDKITE_REQUIRED_RESULT}" \
            '{
              review_policy: $review_policy,
              nix_validation: $nix_validation,
              classify: $classify,
              fork_checks: $fork_checks,
              dispatch: $dispatch,
              buildkite_required: $buildkite_required
            }')"
          jq -e \
            --argjson affected "${AFFECTED_SHARDS_JSON}" \
            --argjson not_required "${NOT_REQUIRED_SHARDS_JSON}" \
            --argjson results "${results}" '
              ($affected | type == "array" and length > 0 and length == (unique | length)) and
              ($not_required | type == "array" and length == (unique | length)) and
              (($affected - ($results | keys)) == []) and
              (($not_required - ($results | keys)) == []) and
              (all($affected[]; $results[.] == "success")) and
              (all($not_required[]; $results[.] == "skipped"))
            ' >/dev/null
          case "${PROFILE}:${EVENT_CLASS}" in
            nix-standard:pull_request)
              [[ "${AFFECTED_SHARDS_JSON}" == '["review_policy","nix_validation"]' ]]
              [[ "${REVIEW_DECISION}" == approved || "${REVIEW_DECISION}" == bypassed ]]
              ;;
            nix-standard:merge_group)
              [[ "${AFFECTED_SHARDS_JSON}" == '["nix_validation"]' ]]
              ;;
            buildkite-isolated:pull_request)
              [[ "${AFFECTED_SHARDS_JSON}" == '["review_policy","classify","dispatch","buildkite_required"]' ]]
              [[ "${REVIEW_DECISION}" == approved || "${REVIEW_DECISION}" == bypassed ]]
              [[ "${TRUST_CLASSIFICATION}" == trusted ]]
              [[ "${FORK_CHECKS_RESULT}" == skipped ]]
              ;;
            buildkite-isolated:merge_group)
              [[ "${AFFECTED_SHARDS_JSON}" == '["classify","dispatch","buildkite_required"]' ]]
              [[ "${TRUST_CLASSIFICATION}" == protected ]]
              [[ "${FORK_CHECKS_RESULT}" == skipped ]]
              ;;
            *)
              exit 1
              ;;
          esac
