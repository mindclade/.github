name: Organization workflow self-test

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mindclade-org-self-test-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self_test:
    name: Mindclade / Organization Workflow Self-Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: context
        name: Validate caller context
        uses: ./.github/actions/validate-trusted-context
        with:
          expected-source-revision: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify immutable implementation closure
        uses: ./.github/actions/verify-pinned-actions
      - name: Install checksum-verified CI launchers
        env:
          BAZELISK_SHA256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
          BAZELISK_URL: https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          JUST_SHA256: 4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
          JUST_URL: https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz
        run: |
          set -euo pipefail
          install_root="${RUNNER_TEMP}/mindclade-ci-bin"
          archive="${RUNNER_TEMP}/just.tar.gz"
          mkdir -p "${install_root}"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "${install_root}/bazelisk" "${BAZELISK_URL}"
          printf '%s  %s\n' "${BAZELISK_SHA256}" "${install_root}/bazelisk" | sha256sum --check --strict
          chmod 0755 "${install_root}/bazelisk"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "${archive}" "${JUST_URL}"
          printf '%s  %s\n' "${JUST_SHA256}" "${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${install_root}" just
          chmod 0755 "${install_root}/just"
          printf '%s\n' "${install_root}" >> "${GITHUB_PATH}"
      - name: Run hermetic repository validation
        env:
          BAZELISK_VERIFY_SHA256: 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694
          USE_BAZEL_VERSION: 9.2.0
        run: |
          set -euo pipefail
          just ci
      - name: Verify internal template pins on approved main
        env:
          APPROVED_MAIN_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/validate_reusable_workflows.py template-pins \
            --root "${GITHUB_WORKSPACE}" \
            --approved-main-revision "${APPROVED_MAIN_REVISION}"
      - name: Verify validation leaves no generated drift
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short)"
