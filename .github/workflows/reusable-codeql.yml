name: Reusable CodeQL analysis

on:
  workflow_call:
    inputs:
      source_revision:
        description: Exact caller source commit SHA.
        required: true
        type: string
      languages:
        description: JSON array of CodeQL language identifiers.
        required: false
        default: '["python"]'
        type: string
      build_mode:
        description: CodeQL build mode, none or autobuild.
        required: false
        default: none
        type: string
    outputs:
      correlation_id:
        description: Stable correlation identifier.
        value: ${{ jobs.prepare.outputs.correlation_id }}
      source_revision:
        description: Validated source revision.
        value: ${{ jobs.prepare.outputs.source_revision }}
      caller_repository:
        description: Validated caller repository.
        value: ${{ jobs.prepare.outputs.caller_repository }}
      trust_classification:
        description: Observed source trust classification.
        value: ${{ jobs.prepare.outputs.source_trust }}
      execution_tier:
        description: Observed execution tier.
        value: ${{ jobs.prepare.outputs.execution_tier }}
      plan_id:
        description: CodeQL plan identifier.
        value: ${{ jobs.protected.outputs.plan_id || jobs.untrusted.outputs.plan_id }}
      build_id:
        description: Provider build identifier.
        value: ${{ github.run_id }}
      conclusion:
        description: Normalized conclusion.
        value: ${{ jobs.protected.outputs.conclusion || jobs.untrusted.outputs.conclusion }}
      reason_code:
        description: Stable conclusion reason.
        value: ${{ jobs.protected.outputs.reason_code || jobs.untrusted.outputs.reason_code }}
      evidence_digest:
        description: Canonical evidence digest.
        value: ${{ jobs.protected.outputs.evidence_digest || jobs.untrusted.outputs.evidence_digest }}
      evidence_ref:
        description: Immutable evidence artifact reference.
        value: ${{ jobs.protected.outputs.evidence_ref || jobs.untrusted.outputs.evidence_ref }}

concurrency:
  group: mindclade-org-codeql-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  prepare:
    name: Mindclade / CodeQL Context
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base_revision: ${{ steps.context.outputs.base_revision }}
      context_json: ${{ steps.context.outputs.context_json }}
      caller_repository: ${{ github.repository }}
      correlation_id: ${{ steps.context.outputs.correlation_id }}
      execution_tier: ${{ steps.context.outputs.execution_tier }}
      source_revision: ${{ inputs.source_revision }}
      implementation_root: ${{ steps.context.outputs.implementation_root }}
      source_trust: ${{ steps.context.outputs.source_trust }}
    steps:
      - id: context
        name: Validate caller context
        uses: mindclade/.github/.github/actions/validate-trusted-context@aabf14ba287eb3453cf9f42e19674df308564d1b
        with:
          expected-source-revision: ${{ inputs.source_revision }}
      - name: Verify immutable implementation closure
        uses: mindclade/.github/.github/actions/verify-pinned-actions@aabf14ba287eb3453cf9f42e19674df308564d1b
      - name: Validate CodeQL configuration
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          LANGUAGES_JSON: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          allowed = {
              "c-cpp", "csharp", "go", "java-kotlin",
              "javascript-typescript", "python", "ruby", "rust", "swift",
          }
          languages = json.loads(os.environ["LANGUAGES_JSON"])
          if not isinstance(languages, list) or len(languages) != 1:
              raise SystemExit("languages must be a JSON array containing exactly one language")
          if any(not isinstance(item, str) or item not in allowed for item in languages):
              raise SystemExit("languages contains an unsupported CodeQL language")
          build_mode = os.environ["BUILD_MODE"]
          if build_mode not in {"none", "autobuild"}:
              raise SystemExit("build_mode must be none or autobuild")
          language = languages[0]
          if build_mode == "autobuild" and language in {"javascript-typescript", "python", "ruby"}:
              raise SystemExit("interpreted CodeQL languages require build_mode none")
          if build_mode == "none" and language in {"go", "java-kotlin", "swift"}:
              raise SystemExit("go, java-kotlin, and swift require build_mode autobuild")
          PY
      - name: Assert the execution tier is analysed by exactly one tier job
        env:
          EXECUTION_TIER: ${{ steps.context.outputs.execution_tier }}
        run: |
          set -euo pipefail
          # untrusted is analysed by the untrusted job; trusted and release by the
          # protected job. Any other value would skip both and pass with no analysis.
          case "${EXECUTION_TIER}" in
            untrusted | trusted | release) ;;
            *)
              echo "unsupported execution tier: ${EXECUTION_TIER}" >&2
              exit 1
              ;;
          esac

  untrusted:
    name: Mindclade / CodeQL (untrusted)
    needs: prepare
    if: needs.prepare.outputs.execution_tier == 'untrusted'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      conclusion: ${{ steps.result.outputs.conclusion }}
      evidence_digest: ${{ steps.evidence.outputs.evidence_digest }}
      evidence_ref: ${{ steps.evidence.outputs.evidence_ref }}
      plan_id: ${{ steps.result.outputs.plan_id }}
      reason_code: ${{ steps.result.outputs.reason_code }}
    steps:
      - id: checkout
        name: Check out exact caller revision
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - id: init
        name: Initialize CodeQL without upload credentials
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.35.1
        with:
          languages: ${{ join(fromJSON(inputs.languages), ',') }}
          build-mode: ${{ inputs.build_mode }}
      - id: analyze
        name: Analyze without uploading security events
        if: steps.init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.35.1
        with:
          output: ${{ runner.temp }}/codeql-untrusted-results
          upload: never
      - id: reports
        name: Collect CodeQL SARIF reports
        if: always()
        continue-on-error: true
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          set -euo pipefail
          mapfile -t reports < <(find "${RUNNER_TEMP}/codeql-untrusted-results" -type f -name '*.sarif' -print 2>/dev/null | sort)
          {
            echo 'paths<<MINDCLADE_EOF'
            printf '%s\n' "${reports[@]}"
            echo MINDCLADE_EOF
          } >> "${GITHUB_OUTPUT}"
          if [[ "${ANALYZE_OUTCOME}" == success ]]; then
            (( ${#reports[@]} > 0 ))
          fi
      - id: result
        name: Normalize result
        if: always()
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          REPORTS_OUTCOME: ${{ steps.reports.outcome }}
          PLAN_ID: codeql-untrusted-v1
        run: |
          set -euo pipefail
          conclusion=success
          reason=CODEQL_ANALYSIS_PASSED
          if [[ "${CHECKOUT_OUTCOME}" != success ]]; then
            conclusion=failure
            reason=SOURCE_CHECKOUT_FAILED
          elif [[ "${INIT_OUTCOME}" != success ]]; then
            conclusion=failure
            reason=CODEQL_INITIALIZATION_FAILED
          elif [[ "${ANALYZE_OUTCOME}" != success ]]; then
            conclusion=failure
            reason=CODEQL_ANALYSIS_FAILED
          elif [[ "${REPORTS_OUTCOME}" != success ]]; then
            conclusion=failure
            reason=CODEQL_REPORT_MISSING
          fi
          printf 'conclusion=%s\nreason_code=%s\nplan_id=%s\n' \
            "${conclusion}" "${reason}" "${PLAN_ID}" >> "${GITHUB_OUTPUT}"
      - id: evidence
        name: Publish CI evidence
        if: always()
        continue-on-error: true
        uses: mindclade/.github/.github/actions/publish-ci-evidence@aabf14ba287eb3453cf9f42e19674df308564d1b
        with:
          context-json: ${{ needs.prepare.outputs.context_json }}
          producer: github_actions
          conclusion: ${{ steps.result.outputs.conclusion }}
          reason-code: ${{ steps.result.outputs.reason_code }}
          plan-id: codeql-untrusted-v1
          build-id: ${{ github.run_id }}
          report-paths: ${{ steps.reports.outputs.paths }}
          artifact-name: codeql-untrusted-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Enforce result
        if: always()
        env:
          CONCLUSION: ${{ steps.result.outputs.conclusion }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail
          [[ "${CONCLUSION}" == success ]]
          [[ "${EVIDENCE_OUTCOME}" == success ]]

  protected:
    name: Mindclade / CodeQL (protected)
    needs: prepare
    if: needs.prepare.outputs.execution_tier == 'trusted' || needs.prepare.outputs.execution_tier == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    outputs:
      conclusion: ${{ steps.result.outputs.conclusion }}
      evidence_digest: ${{ steps.evidence.outputs.evidence_digest }}
      evidence_ref: ${{ steps.evidence.outputs.evidence_ref }}
      plan_id: ${{ steps.result.outputs.plan_id }}
      reason_code: ${{ steps.result.outputs.reason_code }}
    steps:
      - id: checkout
        name: Check out exact caller revision
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - id: init
        name: Initialize CodeQL
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.35.1
        with:
          languages: ${{ join(fromJSON(inputs.languages), ',') }}
          build-mode: ${{ inputs.build_mode }}
      - id: analyze
        name: Analyze and upload security events
        if: steps.init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.35.1
        with:
          output: ${{ runner.temp }}/codeql-protected-results
          upload: always
      - id: reports
        name: Collect CodeQL SARIF reports
        if: always()
        continue-on-error: true
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          set -euo pipefail
          mapfile -t reports < <(find "${RUNNER_TEMP}/codeql-protected-results" -type f -name '*.sarif' -print 2>/dev/null | sort)
          {
            echo 'paths<<MINDCLADE_EOF'
            printf '%s\n' "${reports[@]}"
            echo MINDCLADE_EOF
          } >> "${GITHUB_OUTPUT}"
          if [[ "${ANALYZE_OUTCOME}" == success ]]; then
            (( ${#reports[@]} > 0 ))
          fi
      - id: result
        name: Normalize result
        if: always()
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          REPORTS_OUTCOME: ${{ steps.reports.outcome }}
          PLAN_ID: codeql-protected-v1
        run: |
          set -euo pipefail
          conclusion=success
          reason=CODEQL_ANALYSIS_PASSED
          if [[ "${CHECKOUT_OUTCOME}" != success ]]; then
            conclusion=failure
            reason=SOURCE_CHECKOUT_FAILED
          elif [[ "${INIT_OUTCOME}" != success ]]; then
            conclusion=failure
            reason=CODEQL_INITIALIZATION_FAILED
          elif [[ "${ANALYZE_OUTCOME}" != success ]]; then
            conclusion=failure
            reason=CODEQL_ANALYSIS_FAILED
          elif [[ "${REPORTS_OUTCOME}" != success ]]; then
            conclusion=failure
            reason=CODEQL_REPORT_MISSING
          fi
          printf 'conclusion=%s\nreason_code=%s\nplan_id=%s\n' \
            "${conclusion}" "${reason}" "${PLAN_ID}" >> "${GITHUB_OUTPUT}"
      - id: evidence
        name: Publish CI evidence
        if: always()
        continue-on-error: true
        uses: mindclade/.github/.github/actions/publish-ci-evidence@aabf14ba287eb3453cf9f42e19674df308564d1b
        with:
          context-json: ${{ needs.prepare.outputs.context_json }}
          producer: github_actions
          conclusion: ${{ steps.result.outputs.conclusion }}
          reason-code: ${{ steps.result.outputs.reason_code }}
          plan-id: codeql-protected-v1
          build-id: ${{ github.run_id }}
          report-paths: ${{ steps.reports.outputs.paths }}
          artifact-name: codeql-protected-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Enforce result
        if: always()
        env:
          CONCLUSION: ${{ steps.result.outputs.conclusion }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail
          [[ "${CONCLUSION}" == success ]]
          [[ "${EVIDENCE_OUTCOME}" == success ]]

