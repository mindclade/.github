name: Bug report
description: Report a reproducible defect in the organization GitHub automation source.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, private repository names, or sensitive security details. See SECURITY.md for private reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: State the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give minimal, redacted steps, event context, and the affected source path.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Provide redacted logs, run identifiers, or screenshots. Do not provide secrets.
    validations:
      required: true
  - type: dropdown
    id: activation_state
    attributes:
      label: Activation state
      options:
        - source-ready
        - connected
        - unknown
    validations:
      required: true
